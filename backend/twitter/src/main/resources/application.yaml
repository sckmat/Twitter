## Server
server:
  port: ${SERVER_PORT:8082}

## Spring / MySQL
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

## UMS service
ums:
  host: ${UMS_HOST:http://ums}
  port: ${UMS_PORT:8081}
  paths:
    user: ${UMS_PATHS_USER:/users/user}

## Security / JWT
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ums}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}