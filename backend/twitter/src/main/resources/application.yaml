## Server
server:
  port: 8001

## MySQL
spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/twitter?serverTimezone=UTC&useLegacyDatetimeCode=false
    username: root
    password: passw

ums:
  host: http://localhost
  port: 8000
  paths:
    user: /users/user

security:
  jwt:
    secret: ${JWT_SECRET:secret}
    issuer: ${JWT_ISSUER:ums}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}
