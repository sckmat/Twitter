## Server
server:
  port: ${SERVER_PORT:8000}

## Spring / MySQL
spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

## GitHub OAuth
oauth:
  github:
    client-id: ${GITHUB_CLIENT_ID}
    client-secret: ${GITHUB_CLIENT_SECRET}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://app.local:8081/api/ums/auth/github/callback}
    frontend-redirect: ${FRONTEND_REDIRECT_URI:http://app.local:8081/}
    scope: ${GITHUB_SCOPE:read:user user:email}

## Security / JWT
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:ums}
    ttl-seconds: ${JWT_TTL_SECONDS:86400}