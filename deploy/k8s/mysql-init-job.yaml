apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS appdb;
    USE appdb;

    -- --------------------
    -- UMS tables
    -- --------------------
    DROP TABLE IF EXISTS users_has_roles;
    DROP TABLE IF EXISTS users;
    DROP TABLE IF EXISTS roles;
    DROP TABLE IF EXISTS last_visit;

    CREATE TABLE last_visit
    (
        id    BINARY(16) NOT NULL,
        `in`  INT DEFAULT NULL,
        `out` INT DEFAULT NULL,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

    CREATE TABLE roles
    (
        id          BINARY(16) NOT NULL,
        name        VARCHAR(45) DEFAULT NULL,
        description VARCHAR(45) DEFAULT NULL,
        PRIMARY KEY (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

    CREATE TABLE users
    (
        id            BINARY(16) NOT NULL,
        name          VARCHAR(45) NOT NULL,
        email         VARCHAR(45) NOT NULL,
        password      VARCHAR(45) NOT NULL,
        created       INT DEFAULT NULL,
        last_visit_id BINARY(16) DEFAULT NULL,
        PRIMARY KEY (id),
        UNIQUE KEY email_UNIQUE (email),
        KEY           fk_users_last_visit_idx (last_visit_id),
        CONSTRAINT fk_users_last_visit FOREIGN KEY (last_visit_id) REFERENCES last_visit (id)
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

    CREATE TABLE users_has_roles
    (
        users_id BINARY(16) NOT NULL,
        roles_id BINARY(16) NOT NULL,
        PRIMARY KEY (users_id, roles_id),
        KEY      fk_users_has_roles_roles_idx (roles_id),
        CONSTRAINT fk_users_has_roles_roles FOREIGN KEY (roles_id) REFERENCES roles (id) ON DELETE CASCADE ON UPDATE CASCADE,
        CONSTRAINT fk_users_has_roles_users FOREIGN KEY (users_id) REFERENCES users (id) ON DELETE CASCADE ON UPDATE CASCADE
    ) ENGINE=InnoDB DEFAULT CHARSET=utf8;

