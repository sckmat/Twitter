apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: twitter
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-init
          image: mysql:8.0
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: init
              mountPath: /init
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for mysql..."
              until mysqladmin ping -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
                sleep 2
              done
              echo "Running init.sql..."
              mysql -h mysql -uroot -p"$MYSQL_ROOT_PASSWORD" < /init/init.sql
              echo "Done."
      volumes:
        - name: init
          configMap:
            name: mysql-init