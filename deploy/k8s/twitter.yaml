apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitter
  template:
    metadata:
      labels:
        app: twitter
    spec:
      containers:
        - name: twitter
          image: twitter:1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - secretRef:
                name: jwt-secret
          env:
            # App
            - name: SERVER_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TWITTER_PORT

            # MySQL
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: TWITTER_JDBC_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD

            # UMS client (Twitter -> UMS)
            - name: UMS_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: UMS_HOST
            - name: UMS_PORT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: UMS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: twitter
spec:
  selector:
    app: twitter
  ports:
    - port: 8082
      targetPort: 8082
